<app-header-widget>
  <!-- Here we need to pass drawer through ng-content 
  since News and Header widgets are on the same FSD level (widgets)  -->
  <ng-template #drawerContent>
    <app-news-widget [fillHeight]="true" />
  </ng-template>
</app-header-widget>

<main class="home">
  <div nz-row class="home__account">
    <app-widget-block>
      <app-account-widget />
    </app-widget-block>
  </div>

  <div nz-row [nzGutter]="24">
    <div nz-col [nzXs]="24" [nzMd]="12">
      <app-widget-block>
        <app-deposit-history-widget />
      </app-widget-block>
    </div>

    @if (!isMobile()) {
      <div nz-col [nzSpan]="12">
        <app-widget-block>
          <app-news-widget />
        </app-widget-block>
      </div>
    }
  </div>
</main>

<router-outlet />
