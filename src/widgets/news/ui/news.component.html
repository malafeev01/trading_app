<div nz-flex nzAlign="center" nzJustify="space-between" class="news__toolbar">
  <h2 nz-typography class="news__title">News</h2>

  <nz-select class="news__sort" [ngModel]="ordering()" (ngModelChange)="onOrderingChange($event)">
    <nz-option nzValue="-published_at" nzLabel="Newest first" />
    <nz-option nzValue="published_at" nzLabel="Oldest first" />
  </nz-select>
</div>

<cdk-virtual-scroll-viewport itemSize="85" class="news__viewport">
  <nz-list>
    <nz-list-item *cdkVirtualFor="let item of dataSource">
      @if (item) {
        <nz-list-item-meta [nzAvatar]="item.image_url" [nzDescription]="item.title">
          <nz-list-item-meta-title class="news__row">
            <a [href]="item.url" target="_blank">{{ item.summary }}</a>
          </nz-list-item-meta-title>
        </nz-list-item-meta>
      } @else {
        <nz-skeleton [nzAvatar]="true" [nzParagraph]="{ rows: 1 }" />
      }
    </nz-list-item>
  </nz-list>
</cdk-virtual-scroll-viewport>
